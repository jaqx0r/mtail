name: Bazel Mod Tidy on Renovate PRs

on:
  pull_request:
    paths:
      - 'MODULE.bazel'
      - 'MODULE.bazel.lock'
      - '**/*.bzl'

permissions:
  contents: write

jobs:
  bazel-mod-tidy:
    # Only run on PRs opened by the Mend-hosted Renovate bot
    if: github.actor == 'renovate[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Bazelisk / Bazel
        uses: bazel-contrib/setup-bazel@0.19.2
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}

      - name: Run bazel mod tidy
        run: bazel mod tidy

      - name: Commit updated MODULE files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(bazel): run bazel mod tidy'
          file_pattern: 'MODULE.bazel MODULE.bazel.lock'
